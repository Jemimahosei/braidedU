services:
  - type: web
    name: braidedu-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && python manage.py migrate && python manage.py seed_styles && python manage.py seed_friends && gunicorn braidedu.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: DJANGO_CORS_ALLOW_ALL
        value: "1"
      # Postgres lives on Neon (free): DATABASE_URL is set by hand in the
      # Render dashboard, not from a Render database — Render allows only
      # one free Postgres per workspace and soup-db holds that slot.
      # Keep sync:false so a Blueprint sync never overwrites the Neon URL.
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        value: https://braidedu-frontend.onrender.com
      # Email. SMTP (Gmail app password) reaches any Cornell address, so use it
      # for real sign ups. While no sender can reach new users, sign up skips
      # the confirmation email and signs the user straight in.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # Resend's test sender only reaches its account owner. Set RESEND_FROM
      # once a domain is verified there.
      - key: RESEND_API_KEY
        sync: false

  - type: web
    name: braidedu-frontend
    env: static
    buildCommand: cd web && npm install && npm run build
    staticPublishPath: web/dist
    envVars:
      - key: NODE_VERSION
        value: "20"
      # NOTE: Render may suffix the backend URL (e.g. -0l4v) if the plain name
      # is taken. After the first deploy, check the real backend URL and
      # update this value + redeploy the frontend if it differs.
      - key: VITE_API_URL
        value: https://braidedu-backend.onrender.com/api
