services:
  - type: web
    name: braidedu-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && python manage.py migrate && python manage.py seed_styles && gunicorn braidedu.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: DJANGO_CORS_ALLOW_ALL
        value: "1"
      # Postgres from the free database below, so accounts survive redeploys.
      # (Render's free Postgres expires after 30 days: move to Neon or a paid
      # plan before then and set DATABASE_URL by hand.)
      - key: DATABASE_URL
        fromDatabase:
          name: braidedu-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://braidedu-frontend.onrender.com
      # Email: when set, confirmation and reset emails go out through Resend;
      # unset, they are printed to the server log.
      - key: RESEND_API_KEY
        sync: false

  - type: web
    name: braidedu-frontend
    env: static
    buildCommand: cd web && npm install && npm run build
    staticPublishPath: web/dist
    envVars:
      - key: NODE_VERSION
        value: "20"
      # NOTE: Render may suffix the backend URL (e.g. -0l4v) if the plain name
      # is taken. After the first deploy, check the real backend URL and
      # update this value + redeploy the frontend if it differs.
      - key: VITE_API_URL
        value: https://braidedu-backend.onrender.com/api

databases:
  - name: braidedu-db
    plan: free
    region: oregon
    databaseName: braidedu
    user: braidedu
